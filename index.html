<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#182230">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Food Expert">
<link rel="manifest" href="./manifest.json">
<title>Food Expert Kitchen</title>
<style>
:root{--ink:#182230;--muted:#697586;--line:#dfe4ea;--soft:#f5f7f9;--card:#fff;--accent:#b45f3c;--good:#287a4b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f3f5;color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;min-height:100vh;background:#fff}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.brand{font-weight:900;letter-spacing:-.02em}.nav{display:flex;gap:6px;overflow:auto;padding:8px 12px;border-bottom:1px solid var(--line);background:#fff}.nav button,.ghost,.primary,.danger{border-radius:10px;padding:9px 12px;border:1px solid var(--line);background:#fff;font-weight:750}.nav button.active,.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{flex:1;min-width:210px;padding:11px;border:1px solid var(--line);border-radius:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card,.detail,.item,.notice{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.card{box-shadow:0 3px 14px #1822300b}.thumb{height:150px;border-radius:12px;background:linear-gradient(135deg,#d7dce1,#f7f7f7);display:flex;align-items:center;justify-content:center;font-size:52px;margin-bottom:12px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.small{color:var(--muted);font-size:13px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.chip{background:var(--soft);border-radius:999px;padding:5px 8px;font-size:12px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.list{display:grid;gap:9px}.planner-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.planner-recipes{display:grid;gap:7px;margin-top:9px}.planner-recipe{display:flex;align-items:center;gap:9px;padding:9px;background:var(--soft);border-radius:10px}.planner-recipe .remove{margin-left:auto}.danger{border-color:#e3b9b9;color:#9b3434}.qty{font-weight:800}.modal-backdrop{position:fixed;inset:0;background:#1822307a;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{width:min(620px,100%);background:#fff;border-radius:18px;padding:18px;box-shadow:0 20px 60px #0004}.modal select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:12px 0}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.step{border-left:4px solid var(--accent);padding:12px;margin:10px 0;background:var(--soft);border-radius:8px}.step.done{opacity:.55}.ingredient{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:650px){header{padding:12px}.nav{position:sticky;top:56px;z-index:9}.grid{grid-template-columns:1fr}main{padding:12px}.planner-recipe{align-items:flex-start}.planner-recipe .remove{padding:6px 8px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">👨‍🍳 Food Expert Kitchen</div><div class="small" id="status">Loading…</div></header>
<nav class="nav" id="nav"></nav>
<main id="screen"></main>
</div>
<script>
const $=id=>document.getElementById(id);
let recipes=[];
let state={screen:"library",query:"",favorites:JSON.parse(localStorage.getItem("fe-favorites")||"[]"),plan:JSON.parse(localStorage.getItem("fe-plan")||"null")||{Monday:[],Tuesday:[],Wednesday:[],Thursday:[],Friday:[],Saturday:[],Sunday:[]},market:JSON.parse(localStorage.getItem("fe-market")||"[]"),cook:null};

function save(){localStorage.setItem("fe-favorites",JSON.stringify(state.favorites));localStorage.setItem("fe-plan",JSON.stringify(state.plan));localStorage.setItem("fe-market",JSON.stringify(state.market));}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function emoji(r){let n=r.name.toLowerCase();if(n.includes("sushi"))return"🍣";if(n.includes("lasagna")||n.includes("pasta"))return"🍝";if(n.includes("ramen"))return"🍜";if(n.includes("bread"))return"🍞";if(n.includes("burger"))return"🍔";return"🍳"}
function thumb(r){return r.image?`<div class="thumb"><img src="${esc(r.image)}" alt="${esc(r.name)}" onerror="this.parentElement.innerHTML='<span>${emoji(r)}</span>'"></div>`:`<div class="thumb"><span>${emoji(r)}</span></div>`}
function favorite(r){return state.favorites.includes(r.id)}
function renderNav(){let items=[["library","📚 Recipes"],["planner","📅 Planner"],["market","🛒 Market"]];$("nav").innerHTML=items.map(([id,t])=>`<button class="${state.screen===id?'active':''}" onclick="go('${id}')">${t}</button>`).join("")}
function go(s){state.screen=s;render()}
function render(){renderNav();if(state.screen==="library")library();else if(state.screen==="planner")planner();else if(state.screen==="market")market();else if(state.screen==="recipe")recipeView();else if(state.screen==="cook")cookMode();$("status").textContent=`${recipes.length} recipes`}
function library(){let q=state.query.toLowerCase();let rs=recipes.filter(r=>(r.name+" "+r.categories.join(" ")+" "+r.tags.join(" ")+" "+r.ingredients.map(x=>x.name).join(" ")).toLowerCase().includes(q));$("screen").innerHTML=`<div class="row"><div><h1>Recipe Library</h1><div class="small">Approved Food Expert recipes only.</div></div></div><div class="toolbar"><input placeholder="Search recipe, ingredient, cuisine…" value="${esc(state.query)}" oninput="state.query=this.value;library()"><button class="ghost" onclick="state.query='';library()">Clear</button></div><div class="grid">${rs.map(r=>`<article class="card">${thumb(r)}<div class="row"><h2>${esc(r.name)}</h2><button class="ghost" onclick="toggleFav('${r.id}')">${favorite(r)?"❤️":"♡"}</button></div><div class="small">${r.defaultServings} servings · ${r.prepMinutes} min prep · ${r.cookMinutes} min cook</div><div class="chips">${r.categories.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div><button class="primary" onclick="openRecipe('${r.id}')">Open Recipe</button></article>`).join("")||'<div class="empty">No recipes found.</div>'}</div>`}
function toggleFav(id){let i=state.favorites.indexOf(id);if(i>=0)state.favorites.splice(i,1);else state.favorites.push(id);save();render()}
function openRecipe(id){state.selected=id;state.screen="recipe";render()}
function recipeView(){let r=recipes.find(x=>x.id===state.selected);if(!r){go("library");return}let sides=(r.suggestedSides||[]);$("screen").innerHTML=`<div class="detail"><button class="ghost" onclick="go('library')">← Back</button>${thumb(r)}<div class="row"><div><h1>${esc(r.name)}</h1><div class="small">${r.defaultServings} servings · ${r.prepMinutes} min prep · ${r.cookMinutes} min cook · ${r.difficulty}</div></div><button class="ghost" onclick="toggleFav('${r.id}')">${favorite(r)?"❤️ Favorite":"♡ Favorite"}</button></div><p>${esc(r.description)}</p><div class="row"><button class="primary" onclick="startCook('${r.id}')">▶ Start Cooking</button><button class="ghost" onclick="addRecipeToMarket('${r.id}')">＋ Add to Market</button>${r.source?.url?`<a class="ghost" href="${esc(r.source.url)}" target="_blank" rel="noopener">🎥 Original Video</a>`:""}</div><hr><h2>Ingredients</h2><div class="list">${r.ingredients.map(x=>`<div class="ingredient"><span>${esc(x.name)}</span><span>${x.quantity} ${esc(x.unit)}</span></div>`).join("")}</div><h2>Instructions</h2>${r.steps.map((s,i)=>`<div class="step"><b>${i+1}. ${esc(s.title)}</b><div class="small">${esc(s.time)} · ${esc(s.heat)}</div><p>${esc(s.text)}</p></div>`).join("")}<h2>Doneness Cues</h2><ul>${r.donenessCues.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><h2>Chef Notes</h2><ul>${r.chefNotes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${sides.length?`<h2>Suggested Side Dishes</h2><div class="list">${sides.map((s,i)=>`<div class="item"><div class="row"><div><b>${esc(s.name)}</b><div class="small">${s.ingredients.map(x=>`${x.quantity} ${x.unit} ${x.name}`).join(" · ")}</div></div><div><button class="ghost" onclick="addSideToMarket('${r.id}',${i})">＋ Add this side to market list</button><button class="ghost" onclick="addPermanentSide('${r.id}',${i})">★ Add this side as permanent sidedish</button></div></div></div>`).join("")}</div>`:""}<h2>Substitutions</h2><ul>${r.substitutions.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><h2>Common Mistakes</h2><ul>${r.commonMistakes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`}
function addRecipeToMarket(id){let r=recipes.find(x=>x.id===id);r.ingredients.forEach(x=>state.market.push({...x,source:r.name}));save();alert("Recipe ingredients added to Market List.");go("market")}
function addSideToMarket(id,i){let r=recipes.find(x=>x.id===id),s=r.suggestedSides[i];s.ingredients.forEach(x=>state.market.push({...x,source:s.name}));save();alert(`${s.name} added to Market List.`);go("market")}
function addPermanentSide(id,i){let r=recipes.find(x=>x.id===id),s=r.suggestedSides[i];let saved=JSON.parse(localStorage.getItem("fe-permanent-sides")||"[]");if(!saved.some(x=>x.name===s.name))saved.push(s);localStorage.setItem("fe-permanent-sides",JSON.stringify(saved));alert(`${s.name} saved as a permanent side dish.`)}
function planner(){$("screen").innerHTML=`<div class="detail"><h1>📅 Meal Planner</h1><div class="notice">Plan recipes by day. Changes are saved on this device.</div><div class="list">${Object.keys(state.plan).map(d=>`<div class="item"><div class="planner-head"><b>${d}</b><button class="primary" onclick="openPlannerPicker('${d}')">＋ Add recipe</button></div><div class="planner-recipes">${(state.plan[d]||[]).map((id,n)=>{let r=recipes.find(x=>x.id===id);return r?`<div class="planner-recipe"><span>${emoji(r)}</span><span><b>${esc(r.name)}</b><br><span class="small">${r.defaultServings} servings</span></span><button class="danger" onclick="removePlan('${d}',${n})">Remove</button></div>`:""}).join("")||'<span class="small">No recipes planned yet.</span>'}</div></div>`).join("")}</div></div>`}
function openPlannerPicker(day){$("screen").insertAdjacentHTML("beforeend",`<div class="modal-backdrop" id="plannerModal"><div class="modal"><h2>Add recipe to ${day}</h2><select id="plannerSelect">${recipes.map(r=>`<option value="${r.id}">${emoji(r)} ${esc(r.name)}</option>`).join("")}</select><div class="modal-actions"><button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="confirmPlan('${day}')">Add to ${day}</button></div></div></div>`)}
function closeModal(){$("plannerModal")?.remove()}
function confirmPlan(day){let id=$("plannerSelect").value;if(id){state.plan[day].push(id);save()}closeModal();planner()}
function removePlan(day,i){state.plan[day].splice(i,1);save();planner()}
function market(){let groups={};state.market.forEach((x,i)=>{let key=x.name.toLowerCase().trim();if(!groups[key])groups[key]={name:x.name,unit:x.unit,total:0,items:[]};if(typeof x.quantity==="number")groups[key].total+=x.quantity;groups[key].items.push(i)});let arr=Object.values(groups);$("screen").innerHTML=`<div class="detail"><div class="row"><div><h1>🛒 Market List</h1><div class="small">Items are consolidated by ingredient name.</div></div><button class="danger" onclick="clearMarket()">Clear</button></div><div class="list">${arr.map(g=>`<div class="item"><div class="row"><b>☐ ${esc(g.name)}</b><span class="qty">${g.total?g.total+" "+esc(g.unit):"as needed"}</span></div><div class="small">${g.items.map(i=>esc(state.market[i].source||"")).filter(Boolean).join(" · ")}</div></div>`).join("")||'<div class="empty">Your market list is empty.</div>'}</div></div>`}
function clearMarket(){state.market=[];save();market()}
function startCook(id){state.selected=id;state.cook={index:0};state.screen="cook";render()}
function cookMode(){let r=recipes.find(x=>x.id===state.selected),i=state.cook.index,s=r.steps[i];$("screen").innerHTML=`<div class="detail"><button class="ghost" onclick="openRecipe('${r.id}')">← Recipe</button><h1>👨‍🍳 Cook Mode</h1><div class="small">Step ${i+1} / ${r.steps.length}</div><div class="step"><h2>${esc(s.title)}</h2><div class="chips"><span class="chip">⏱ ${esc(s.time)}</span><span class="chip">🔥 ${esc(s.heat)}</span></div><p>${esc(s.text)}</p></div><h3>Recipe amounts</h3><div class="list">${r.ingredients.map(x=>`<div class="ingredient"><span>${esc(x.name)}</span><b>${x.quantity} ${esc(x.unit)}</b></div>`).join("")}</div><h3>Doneness cues</h3><ul>${r.donenessCues.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div class="row"><button class="ghost" onclick="cookBack()">← Previous</button><button class="primary" onclick="cookNext()">${i===r.steps.length-1?"Finish":"Done → Next"}</button></div></div>`}
function cookBack(){if(state.cook.index>0)state.cook.index--;render()}
function cookNext(){let r=recipes.find(x=>x.id===state.selected);if(state.cook.index<r.steps.length-1){state.cook.index++;render()}else{alert("Recipe complete! Great work.");openRecipe(r.id)}}
async function load(){try{let bust=`?v=${Date.now()}`;let res=await fetch("./data/recipes.json"+bust,{cache:"no-store"});if(!res.ok)throw Error();recipes=await res.json();render()}catch(e){$("status").textContent="Recipe data unavailable";$("screen").innerHTML='<div class="empty">Could not load the recipe database.</div>'}}
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
load();
</script>
</body>
</html>
